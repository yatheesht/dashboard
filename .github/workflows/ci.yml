name: ci
on: [push, pull_request]
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in js/*.js; do node --check "$f"; done
      - run: test -f index.html && test -f assets/logo.svg && echo OK
