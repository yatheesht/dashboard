<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Open Dashboard logo">
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1C1C1C"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#EDECE4" stroke-opacity="0.12" stroke-width="2"/>
  <!-- open grid -->
  <g fill="none" stroke="#EDECE4" stroke-width="3.2" stroke-linecap="round">
    <rect x="15" y="15" width="16" height="16" rx="5"/>
    <rect x="35" y="15" width="14" height="16" rx="5"/>
    <rect x="15" y="35" width="16" height="14" rx="5"/>
  </g>
  <!-- accent dashboard cell + pulse -->
  <rect x="35" y="35" width="14" height="14" rx="5" fill="#A90533"/>
  <circle cx="42" cy="42" r="2.6" fill="#FFFDF9"/>
  <circle cx="50.5" cy="13.5" r="3.2" fill="#B30838"/>
</svg>
